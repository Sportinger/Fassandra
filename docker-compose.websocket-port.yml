# Docker Compose override to add dedicated WebSocket port
# This file should be used with: docker-compose -f docker-compose.mylayer.yml -f docker-compose.websocket-port.yml up -d

version: '3.8'

services:
  backend:
    ports:
      - "3001:3001"  # Regular HTTP API
      - "3002:3001"  # WebSocket port (maps external 3002 to internal 3001)