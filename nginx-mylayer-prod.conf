# Production nginx configuration for mylayer.org
# This file should be placed at /etc/nginx/sites-available/mylayer.org on the server

# WebSocket connection upgrade map - MUST be defined before server blocks
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# HTTP - redirect all to HTTPS
server {
    listen 80;
    server_name mylayer.org www.mylayer.org;
    
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl http2;
    server_name mylayer.org www.mylayer.org;
    
    # SSL certificates from Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/mylayer.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mylayer.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # CRITICAL: Increase max body size to handle large Yjs updates
    client_max_body_size 50M;
    
    # CRITICAL: Disable proxy buffering for WebSocket connections
    proxy_buffering off;
    
    # Frontend (React app served by nginx in Docker container)
    location / {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Backend API
    location /api {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support for /api/collab
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        
        # CRITICAL: WebSocket-specific settings to prevent data corruption
        proxy_read_timeout 86400s;  # 24 hours for long-lived connections
        proxy_send_timeout 86400s;
        
        # Disable buffering for WebSocket
        proxy_buffering off;
        proxy_request_buffering off;
        
        # Increase buffer sizes for large binary messages
        proxy_buffer_size 64k;
        proxy_buffers 8 64k;
        proxy_busy_buffers_size 128k;
    }
    
    # Health check endpoint
    location /health {
        proxy_pass http://localhost:3001/health;
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}