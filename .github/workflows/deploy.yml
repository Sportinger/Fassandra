name: Build Images and Deploy to Hetzner Server

# Deployment strategy:
# - dev branch: Builds images for manual deployment (fast development cycle)
# - main/production branches: Builds images AND auto-deploys to Hetzner server
# This allows flexible development while keeping production stable
on:
  push:
    branches: [dev, main, production]
  workflow_dispatch: # Allow manual deployment

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Extract metadata
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: runtime  # Use production runtime stage
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            DATABASE_URL=${{ secrets.DATABASE_URL }}

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.https
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
            VITE_WS_BASE_URL=${{ secrets.VITE_WS_BASE_URL }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    # Auto-deploy only for main/production branches
    # Dev branch: Images are built and available for manual deployment
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production'

    steps:
      - name: Deploy to Hetzner Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            cd /opt/pessoa
            
            # Set image tag to the commit SHA
            export IMAGE_TAG=sha-${{ github.sha }}
            
            # Pull latest images using the Hetzner GitHub Actions compose file
            docker compose -f docker-compose.hetzner-github-actions.yml pull
            
            # Stop and remove old containers
            docker compose -f docker-compose.hetzner-github-actions.yml down
            
            # Start new containers
            docker compose -f docker-compose.hetzner-github-actions.yml up -d
            
            # Clean up old images to save space
            docker image prune -f
            
            # Show status
            docker compose -f docker-compose.hetzner-github-actions.yml ps
            
            # Show logs for troubleshooting
            echo "=== Backend Logs ==="
            docker compose -f docker-compose.hetzner-github-actions.yml logs --tail=10 backend
            echo "=== Frontend Logs ==="
            docker compose -f docker-compose.hetzner-github-actions.yml logs --tail=10 frontend 

  dev-branch-info:
    needs: build-and-push
    runs-on: ubuntu-latest
    # Provide deployment instructions for dev branch
    if: github.ref == 'refs/heads/dev'
    
    steps:
      - name: Dev Branch - Manual Deployment Instructions
        run: |
          echo "🚀 Dev branch images built successfully!"
          echo ""
          echo "📦 Images available:"
          echo "  - ghcr.io/sportinger/pessoa-backend:dev"
          echo "  - ghcr.io/sportinger/pessoa-frontend:dev"
          echo ""
          echo "🔧 To deploy manually:"
          echo "  ssh roman@mylayer.org"
          echo "  cd /opt/pessoa"
          echo "  sed -i 's/^IMAGE_TAG=.*/IMAGE_TAG=dev/' .env"
          echo "  docker compose -f docker-compose.hetzner-github-actions.yml pull"
          echo "  docker compose -f docker-compose.hetzner-github-actions.yml up -d"
          echo ""
          echo "⚡ Or use local fast deployment:"
          echo "  ./scripts/dev_deploy.sh"