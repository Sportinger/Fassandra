# Development environment on server (dev.fassandra.de)
# Uses shared Caddy and database from docker-compose.prod.yml
# Service names must match Caddyfile reverse_proxy targets

services:
  dev-backend:
    image: mylayer-backend:dev
    container_name: mylayer_dev_backend
    restart: unless-stopped
    env_file: .env.dev
    environment:
      CLAUDE_BIN: /host-claude/bin/claude
    depends_on:
      db:
        condition: service_healthy
    networks:
      - fassandra-network
    volumes:
      - ./backend/uploads:/app/uploads
      - ./yjs-parser:/app/yjs-parser:ro
      - ~/.config/claude-code:/home/appuser/.config/claude-code:rw
      - ~/.claude:/home/appuser/.claude:rw
      - ~/.nvm/versions/node/v22.19.0/bin:/host-claude/bin:ro
      - ~/.nvm/versions/node/v22.19.0/lib/node_modules:/host-claude/lib/node_modules:ro
      - ~/.config/gcloud:/root/.config/gcloud:ro
      - ~/.config/g.py:/root/.config/g.py:ro
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  dev-frontend:
    image: mylayer-frontend:dev
    container_name: mylayer_dev_frontend
    restart: unless-stopped
    networks:
      - fassandra-network

  # Reference to shared database from prod
  db:
    image: postgres:17
    container_name: mylayer_fassandra_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fassandra-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  fassandra-network:
    external: true
    name: app_fassandra-network

volumes:
  postgres_data:
    external: true
    name: mylayer_postgres_data
