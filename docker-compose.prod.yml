# 🚀 PRODUCTION ENVIRONMENT
# For deployment to Hetzner server (pessoa.theater)

services:
  db:
    image: postgres:15
    container_name: ${CONTAINER_PREFIX:-prod_}pessoa_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    image: ${DOCKER_REGISTRY}/pessoa-backend:${IMAGE_TAG:-latest}
    container_name: ${CONTAINER_PREFIX:-prod_}pessoa_backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_API_URL: ${GEMINI_API_URL}
      BACKEND_PORT: 3001
      APP_DOMAIN: ${APP_DOMAIN}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-20}
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: ${DOCKER_REGISTRY}/pessoa-frontend:${IMAGE_TAG:-latest}
    container_name: ${CONTAINER_PREFIX:-prod_}pessoa_frontend
    volumes:
      # Let's Encrypt SSL certificates for pessoa.theater
      - /etc/letsencrypt/live/pessoa.theater/fullchain.pem:/etc/ssl/certs/server.crt:ro
      - /etc/letsencrypt/live/pessoa.theater/privkey.pem:/etc/ssl/private/server.key:ro
    ports:
      - "80:80"     # HTTP (redirects to HTTPS)
      - "443:443"   # HTTPS
    depends_on:
      - backend
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ${CONTAINER_PREFIX:-prod_}pessoa_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
    name: ${CONTAINER_PREFIX:-prod_}postgres_data
  pgadmin_data:
    name: ${CONTAINER_PREFIX:-prod_}pgadmin_data 