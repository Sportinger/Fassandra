<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- Note: frame-ancestors is ignored in meta CSPs; set via HTTP header instead. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; img-src 'self' data: https:; connect-src 'self' ws: wss: http: https: https://accounts.google.com https://apis.google.com; font-src 'self' data: https://fonts.gstatic.com; frame-src https://accounts.google.com https://apis.google.com; object-src 'none'; base-uri 'self'; form-action 'self';" />
    <meta name="theme-color" content="#646cff" />
    <!-- Deprecated: apple-mobile-web-app-capable; use mobile-web-app-capable as well -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- One-origin wipe fallback for browsers without Clear-Site-Data support (e.g., Safari). Runs on every top-level load. -->
    <script>
      (function () {
        try {
          // Skip if not a top-level browsing context
          if (window.top !== window.self) return;

          // Clear storages
          try { localStorage.clear(); } catch {}
          try { sessionStorage.clear(); } catch {}

          // Clear IndexedDB (best-effort)
          if (window.indexedDB) {
            if (indexedDB.databases) {
              indexedDB.databases().then(function (dbs) {
                dbs.forEach(function (db) { if (db && db.name) { try { indexedDB.deleteDatabase(db.name); } catch {} } });
              });
            }
          }

          // Clear Cache Storage
          if (window.caches && caches.keys) {
            caches.keys().then(function (keys) { keys.forEach(function (k) { caches.delete(k); }); });
          }

          // Unregister service workers
          if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
            navigator.serviceWorker.getRegistrations().then(function (regs) { regs.forEach(function (r) { r.unregister(); }); });
          }

          // Best-effort delete JS-visible cookies (HttpOnly must be cleared server-side)
          document.cookie.split(';').forEach(function (c) {
            var name = c.split('=')[0].trim();
            if (!name) return;
            document.cookie = name + '=; Max-Age=0; Path=/; SameSite=Lax';
          });
        } catch (e) {}
      })();
    </script>
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Fassandra" />
    <title>Fassandra – Texte & Cues</title>
    <!-- Google Fonts for Typewriter styles -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=Special+Elite&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
