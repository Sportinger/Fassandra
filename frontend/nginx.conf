server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Handle Single Page Application routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Forward authentication requests to the backend service
    location ~ ^/(login|register|health)$ {
        # Add Docker's internal DNS resolver
        resolver 127.0.0.11 valid=30s;
        set $upstream_backend backend:3001;
        proxy_pass http://$upstream_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Forward API requests to the backend service
    location /api/ {
        # Add Docker's internal DNS resolver
        resolver 127.0.0.11 valid=30s;
        set $upstream_backend backend:3001;
        proxy_pass http://$upstream_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;  # Increased timeout for WebSocket connections
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;

        # CORS Headers Removed - Should be handled by Axum backend
        # add_header Access-Control-Allow-Origin *;
        # add_header Access-Control-Allow-Methods ...;
        # add_header Access-Control-Allow-Headers ...;
        # add_header Access-Control-Allow-Credentials ...;
        
        # Handle preflight requests - Let Axum handle this too
        # if ($request_method = 'OPTIONS') { ... }
    }

    # Enable gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
} 