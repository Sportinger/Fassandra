# Simple nginx configuration for frontend container (internal use only)
# The main nginx reverse proxy handles SSL termination
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    
    # CRITICAL: Increase max body size to handle large Yjs updates
    client_max_body_size 50M;

    # Disable automatic HTTPS redirect since main nginx handles SSL
    # No SSL configuration needed here

    # Forward API requests to backend (using Docker network)
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $upstream_backend backend:3001;
        proxy_pass http://$upstream_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_cache_bypass $http_upgrade;
        
        # CRITICAL: WebSocket-specific settings to prevent data corruption
        proxy_read_timeout 86400s;  # 24 hours for long-lived connections
        proxy_send_timeout 86400s;
        
        # Disable buffering for WebSocket
        proxy_buffering off;
        proxy_request_buffering off;
        
        # Increase buffer sizes for large binary messages
        proxy_buffer_size 64k;
        proxy_buffers 8 64k;
        proxy_busy_buffers_size 128k;
    }

    # Forward auth requests to backend
    location ~ ^/(login|register|health)$ {
        resolver 127.0.0.11 valid=30s;
        set $upstream_backend backend:3001;
        proxy_pass http://$upstream_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Static file serving
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json;
}