# Simple nginx configuration for frontend container (internal use only)
# The main nginx reverse proxy handles SSL termination and API proxying
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    
    # CRITICAL: This nginx should ONLY serve static files
    # The main nginx proxy handles all API requests to prevent double-proxying
    # which can corrupt WebSocket/Yjs data

    # Static file serving
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json;
}