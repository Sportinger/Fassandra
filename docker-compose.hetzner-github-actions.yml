# Production Docker Compose for Hetzner Server (GitHub Actions Compatible)
# Based on your working configuration, adapted for pre-built images

services:
  db:
    image: postgres:15
    container_name: ${CONTAINER_PREFIX}pessoa_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pessoa_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT}:${DB_INTERNAL_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - pessoa_network

  backend:
    # 🚀 CHANGED: Using pre-built image instead of building on server
    image: ${DOCKER_REGISTRY}/pessoa-backend:${IMAGE_TAG:-latest}
    container_name: ${CONTAINER_PREFIX}pessoa_backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_API_URL: ${GEMINI_API_URL}
      BACKEND_PORT: ${BACKEND_INTERNAL_PORT:-3001}
      APP_DOMAIN: ${APP_DOMAIN}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-10}
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "${BACKEND_PORT}:${BACKEND_INTERNAL_PORT}"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - pessoa_network
    # 🚀 REMOVED: No more source code mounting or cargo-watch

  frontend:
    # 🚀 CHANGED: Using pre-built image instead of building on server
    image: ${DOCKER_REGISTRY}/pessoa-frontend:${IMAGE_TAG:-latest}
    container_name: ${CONTAINER_PREFIX}pessoa_frontend
    volumes:
      # 🚀 Let's Encrypt SSL certificates for pessoa.theater
      - /etc/letsencrypt/live/pessoa.theater/fullchain.pem:/etc/ssl/certs/server.crt:ro
      - /etc/letsencrypt/live/pessoa.theater/privkey.pem:/etc/ssl/private/server.key:ro
    ports:
      # 🚀 Standard HTTP/HTTPS ports (no port number needed in URL)
      - "80:80"       # HTTP port (for redirect)
      - "443:443"     # HTTPS port (standard, no :443 needed)
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - pessoa_network
    # 🚀 REMOVED: No more source code mounting or hot-reload

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ${CONTAINER_PREFIX}pessoa_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_LISTEN_PORT: ${PGADMIN_INTERNAL_PORT:-80}
    ports:
      - "${PGADMIN_PORT:-5050}:${PGADMIN_INTERNAL_PORT:-80}"
    volumes:
      - pessoa_pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - pessoa_network

volumes:
  pessoa_pgdata:
    name: ${CONTAINER_PREFIX}pessoa_pgdata
  pessoa_pgadmin_data:
    name: ${CONTAINER_PREFIX}pessoa_pgadmin_data
  # 🚀 REMOVED: No more cargo-cache and target-cache (not needed for pre-built images)

networks:
  pessoa_network:
    driver: bridge 