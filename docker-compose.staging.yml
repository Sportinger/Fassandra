# Development Docker Compose for Testing Experimental Features
# Uses standard ports for development environment (mylayer.org)

services:
  db:
    image: postgres:15
    container_name: ${CONTAINER_PREFIX}pessoa_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pessoa_dev_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT}:${DB_INTERNAL_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - pessoa_dev_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${CONTAINER_PREFIX}pessoa_backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_API_URL: ${GEMINI_API_URL}
      BACKEND_PORT: ${BACKEND_INTERNAL_PORT:-3001}
      APP_DOMAIN: ${APP_DOMAIN}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-10}
      RUST_LOG: ${RUST_LOG:-debug}
    ports:
      - "${BACKEND_PORT}:${BACKEND_INTERNAL_PORT}"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - pessoa_dev_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_WS_BASE_URL: ${VITE_WS_BASE_URL}
    container_name: ${CONTAINER_PREFIX}pessoa_frontend
    volumes:
      # Mount SSL certificates from host
      - ${SSL_CERT_PATH}:/etc/ssl/certs/server.crt:ro
      - ${SSL_KEY_PATH}:/etc/ssl/private/server.key:ro
    ports:
      - "${FRONTEND_PORT}:80"
      - "${FRONTEND_HTTPS_PORT}:443"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - pessoa_dev_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ${CONTAINER_PREFIX}pessoa_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:${PGADMIN_INTERNAL_PORT}"
    volumes:
      - pessoa_dev_pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - pessoa_dev_network

volumes:
  pessoa_dev_pgdata:
    name: ${CONTAINER_PREFIX}pessoa_pgdata
  pessoa_dev_pgadmin_data:
    name: ${CONTAINER_PREFIX}pessoa_pgadmin_data

networks:
  pessoa_dev_network:
    name: ${CONTAINER_PREFIX}pessoa_dev_network
    driver: bridge