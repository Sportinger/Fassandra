[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7.5", features = ["macros", "ws", "multipart"] }
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0.120"
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
sqlx = { version = "0.7.4", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "macros"] }
sqlx-cli = { version = "0.7.4", features = ["native-tls", "postgres"] }
dotenvy = "0.15"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tower = { version = "0.4.13", features = ["full"] }
tower-http = { version = "0.5.2", features = ["cors", "trace", "limit"] }
tower-cookies = "0.10"
time = "0.3"
thiserror = "1.0"
jsonwebtoken = "9"
tokio = { version = "1", features = ["full"] }
# Pin base64ct to avoid Rust edition 2024 requirement
base64ct = "=1.6.0"
argon2 = "0.5"
validator = { version = "0.16", features = ["derive"] }
regex = "1.10"
lazy_static = "1.4"
anyhow = "1.0.81"
tracing = "0.1"
serde_qs = "0.12"
# Removed docx-rs as it's no longer needed with PDF-only processing
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
async-trait = "0.1"
tokio-tungstenite = "0.24"
url = "2.5"
futures-util = "0.3"
once_cell = "1.19"
dashmap = "5.5"
rand = "0.8"
urlencoding = "2.1.3"
base64 = "0.22.1"
html-escape = "0.2"
yrs = { version = "0.24.0", features = ["sync"] }
hex = "0.4.3"
zip = "0.6"
async-stream = "0.3"

# Added for to_string_lossy suggestion
rustix = "0.38"

[[bin]]
name = "hash_password"
path = "scripts/hash_password.rs"



[dev-dependencies]
tokio-test = "0.4"
futures = "0.3"
mockall = "0.12"
