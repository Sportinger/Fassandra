# Local Development Docker Compose with HTTPS
# Uses internal nginx for SSL termination and local building

services:
  db:
    image: postgres:15
    container_name: ${CONTAINER_PREFIX}pessoa_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pessoa_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT}:${DB_INTERNAL_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - pessoa_network

  backend:
    container_name: ${CONTAINER_PREFIX}pessoa_backend
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: builder
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_API_URL: ${GEMINI_API_URL}
      BACKEND_PORT: ${BACKEND_INTERNAL_PORT:-3001}
      APP_DOMAIN: ${APP_DOMAIN}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-10}
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "${BACKEND_PORT}:${BACKEND_INTERNAL_PORT}"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - cargo-cache:/usr/local/cargo/registry
      - target-cache:/app/target
    command: ["sh", "-c", "cargo-watch -q -x 'run --bin backend'"]
    restart: unless-stopped
    networks:
      - pessoa_network

  frontend:
    container_name: ${CONTAINER_PREFIX}pessoa_frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile.local
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_WS_BASE_URL: ${VITE_WS_BASE_URL}
    ports:
      - "${FRONTEND_PORT:-8080}:80"         # HTTP port (for redirect)
      - "${FRONTEND_HTTPS_PORT:-8443}:443"  # HTTPS port
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - pessoa_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ${CONTAINER_PREFIX}pessoa_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_LISTEN_PORT: ${PGADMIN_INTERNAL_PORT:-80}
    ports:
      - "${PGADMIN_PORT:-5050}:${PGADMIN_INTERNAL_PORT:-80}"
    volumes:
      - pessoa_pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - pessoa_network

volumes:
  pessoa_pgdata:
    name: ${CONTAINER_PREFIX}pessoa_pgdata
  cargo-cache:
    name: ${CONTAINER_PREFIX}cargo-cache
  target-cache:
    name: ${CONTAINER_PREFIX}target-cache
  pessoa_pgadmin_data:
    name: ${CONTAINER_PREFIX}pessoa_pgadmin_data

networks:
  pessoa_network:
    name: ${CONTAINER_PREFIX}pessoa_network
    driver: bridge 