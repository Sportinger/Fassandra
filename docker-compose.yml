# 🏠 LOCAL DEVELOPMENT ENVIRONMENT
# Simple, clean setup for local development with HTTPS

services:
  db:
    image: postgres:15
    container_name: ${CONTAINER_PREFIX:-dev_}pessoa_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    container_name: ${CONTAINER_PREFIX:-dev_}pessoa_backend
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: builder
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_API_URL: ${GEMINI_API_URL}
      BACKEND_PORT: 3001
      APP_DOMAIN: ${APP_DOMAIN}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-10}
      RUST_LOG: ${RUST_LOG:-info}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_PLACEHOLDER_HASH: ${ADMIN_PLACEHOLDER_HASH}
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - cargo_cache:/usr/local/cargo/registry
      - target_cache:/app/target
    command: ["sh", "-c", "cargo-watch -q -x 'run --bin backend'"]
    restart: unless-stopped

  frontend:
    container_name: ${CONTAINER_PREFIX:-dev_}pessoa_frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile.https
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_WS_BASE_URL: ${VITE_WS_BASE_URL}
    ports:
      - "${FRONTEND_PORT:-8080}:80"         # HTTP (redirects to HTTPS)
      - "${FRONTEND_HTTPS_PORT:-8443}:443"  # HTTPS (nginx with SSL)
    depends_on:
      - backend
    volumes:
      - ./frontend/ssl:/etc/ssl:ro          # Mount SSL certificates
      - ./frontend/nginx-local.conf:/etc/nginx/conf.d/default.conf:ro  # Local HTTPS config
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ${CONTAINER_PREFIX:-dev_}pessoa_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
    name: ${CONTAINER_PREFIX:-dev_}postgres_data
  cargo_cache:
    name: ${CONTAINER_PREFIX:-dev_}cargo_cache
  target_cache:
    name: ${CONTAINER_PREFIX:-dev_}target_cache
  pgadmin_data:
    name: ${CONTAINER_PREFIX:-dev_}pgadmin_data 