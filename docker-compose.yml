# 🏠 LOCAL DEVELOPMENT ENVIRONMENT
# Simple, clean setup for local development with HTTPS

services:
  db:
    image: postgres:15
    container_name: ${CONTAINER_PREFIX:-dev_}pessoa_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    container_name: ${CONTAINER_PREFIX:-dev_}pessoa_backend
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgres://pessoa_user:${POSTGRES_PASSWORD:-dev_password_123}@db:5432/pessoa_db
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - RUST_LOG=debug
      - CLAUDE_CODE_DEBUG=1
      - HOME=/home/appuser
      - BACKEND_PORT=3000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Don't mount source code over the binary
      - cargo_cache:/usr/local/cargo/registry
      - target_cache:/app/target
      # Persist Claude Code configuration to a stable location
      - claude_config:/home/appuser/.claude
      # Persist Claude Code config directory
      - claude_config_json:/home/appuser/.config/claude-code
      # Persist Gemini CLI configuration
      - gemini_config:/home/appuser/.gemini
      # Persist uploaded files - bind mount for easy access
      - ./backend/uploads:/app/uploads
    entrypoint: ["/app/docker-entrypoint.sh"]
    command: ["/app/backend"]
    restart: unless-stopped

  frontend:
    container_name: ${CONTAINER_PREFIX:-dev_}pessoa_frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_WS_BASE_URL: ${VITE_WS_BASE_URL}
    ports:
      - "${FRONTEND_PORT:-8080}:8080"       # Dev server
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src:ro          # Mount source code for hot reload
      - ./frontend/public:/app/public:ro    # Mount public assets
      - ./frontend/index.html:/app/index.html:ro  # Mount index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts:ro  # Mount vite config
      - ./frontend/tsconfig.json:/app/tsconfig.json:ro    # Mount tsconfig
      - ./frontend/tsconfig.app.json:/app/tsconfig.app.json:ro  # Mount tsconfig
      - ./frontend/tsconfig.node.json:/app/tsconfig.node.json:ro  # Mount tsconfig
    environment:
      - VITE_API_BASE_URL=
      - VITE_WS_BASE_URL=${VITE_WS_BASE_URL}
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ${CONTAINER_PREFIX:-dev_}pessoa_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
    name: ${CONTAINER_PREFIX:-dev_}postgres_data
  cargo_cache:
    name: ${CONTAINER_PREFIX:-dev_}cargo_cache
  target_cache:
    name: ${CONTAINER_PREFIX:-dev_}target_cache
  pgadmin_data:
    name: ${CONTAINER_PREFIX:-dev_}pgadmin_data
  # Claude Code configuration volumes
  claude_config:
    name: ${CONTAINER_PREFIX:-dev_}claude_config
  claude_config_json:
    name: ${CONTAINER_PREFIX:-dev_}claude_config_json
  # Gemini CLI configuration volume
  gemini_config:
    name: ${CONTAINER_PREFIX:-dev_}gemini_config 